version: "3.9"

services:
  db:
    image: postgres:16
    container_name: umclick-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-umclick}
      POSTGRES_USER: ${POSTGRES_USER:-umclick}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-umclick}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-umclick} -d ${POSTGRES_DB:-umclick}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: umclick-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: umclick-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CHANNEL_LAYER_REDIS_URL: ${CHANNEL_LAYER_REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      AUTO_REVEAL_BEAT_INTERVAL_SEC: ${AUTO_REVEAL_BEAT_INTERVAL_SEC:-1}
    volumes:
      - ./backend:/app
    command: >
      sh -c "python manage.py makemigrations quiz session --noinput &&
      python manage.py migrate --noinput &&
      python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ./backend
    container_name: umclick-celery-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CHANNEL_LAYER_REDIS_URL: ${CHANNEL_LAYER_REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      AUTO_REVEAL_BEAT_INTERVAL_SEC: ${AUTO_REVEAL_BEAT_INTERVAL_SEC:-1}
    volumes:
      - ./backend:/app
    command: >
      sh -c "python manage.py migrate --noinput &&
      celery -A umclick worker -l info"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
    container_name: umclick-celery-beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CHANNEL_LAYER_REDIS_URL: ${CHANNEL_LAYER_REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      AUTO_REVEAL_BEAT_INTERVAL_SEC: ${AUTO_REVEAL_BEAT_INTERVAL_SEC:-1}
    volumes:
      - ./backend:/app
    command: >
      sh -c "python manage.py migrate --noinput &&
      celery -A umclick beat -l info"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: ghcr.io/cirruslabs/flutter:stable
    container_name: umclick-frontend
    working_dir: /app
    restart: unless-stopped
    command: >
      bash -lc "flutter config --enable-web && flutter pub get &&
      flutter run -d web-server --web-hostname=0.0.0.0 --web-port=3000"
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
