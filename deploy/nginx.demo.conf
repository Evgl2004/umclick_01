map "$request_method:$uri" $umclick_request_group {
    default "";
    "POST:/api/auth/register/" login;
    "POST:/api/auth/token/" login;
    "POST:/api/auth/token/refresh/" login;
    "GET:/api/sessions/join/preview/" login;
    "POST:/api/sessions/join/" login;
    ~^(?!OPTIONS:)[A-Z]+:/api/ game;
}

map $umclick_request_group $umclick_login_ip_key {
    default "";
    login $binary_remote_addr;
}

map $umclick_request_group $umclick_login_stage_key {
    default "";
    login "umclick-demo-stage";
}

map $umclick_request_group $umclick_game_ip_key {
    default "";
    game $binary_remote_addr;
}

map $umclick_request_group $umclick_game_stage_key {
    default "";
    game "umclick-demo-stage";
}

limit_req_zone $umclick_login_ip_key zone=login_ip:10m rate=10r/s;
limit_req_zone $umclick_login_stage_key zone=login_stage:10m rate=30r/s;
limit_req_zone $umclick_game_ip_key zone=game_ip:10m rate=100r/s;
limit_req_zone $umclick_game_stage_key zone=game_stage:10m rate=200r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;
    limit_req_status 429;
    error_page 429 = @nginx_rate_limited;

    location /api/ {
        limit_req zone=login_ip burst=120 nodelay;
        limit_req zone=login_stage burst=240 nodelay;
        limit_req zone=game_ip burst=300 nodelay;
        limit_req zone=game_stage burst=600 nodelay;
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_intercept_errors off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @nginx_rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"code":"rate_limited","detail":"Слишком много запросов на входном прокси.","retry_after":1}';
    }

    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
