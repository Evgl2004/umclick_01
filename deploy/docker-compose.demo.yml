x-backend-common: &backend-common
  build:
    context: ../backend
  env_file:
    - ../.env.demo
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    REDIS_URL: redis://redis:6379/0
    CHANNEL_LAYER_REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    AUTO_REVEAL_BEAT_INTERVAL_SEC: ${AUTO_REVEAL_BEAT_INTERVAL_SEC:-1}

services:
  db:
    image: postgres:16-alpine
    container_name: umclick-demo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-umclick}
      POSTGRES_USER: ${POSTGRES_USER:-umclick}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-umclick-change-me}
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-umclick} -d ${POSTGRES_DB:-umclick}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: umclick-demo-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  migrate:
    <<: *backend-common
    container_name: umclick-demo-migrate
    restart: "no"
    command: python manage.py migrate --noinput
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend-common
    container_name: umclick-demo-backend
    restart: unless-stopped
    command: python -m daphne -b 0.0.0.0 -p 8000 umclick.asgi:application
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  celery-worker:
    <<: *backend-common
    container_name: umclick-demo-celery-worker
    restart: unless-stopped
    command: celery -A umclick worker -l warning --concurrency=${CELERY_WORKER_CONCURRENCY:-1}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  celery-beat:
    <<: *backend-common
    container_name: umclick-demo-celery-beat
    restart: unless-stopped
    command: celery -A umclick beat -l warning
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    image: nginx:1.27-alpine
    container_name: umclick-demo-frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ../frontend/build/web:/usr/share/nginx/html:ro
      - ./nginx.demo.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  demo_postgres_data:
